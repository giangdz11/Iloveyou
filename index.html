<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trả lời thành thật đi nha!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochi+Iyagi&family=Quicksand:wght@600;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffe6e6, #ffb3b3);
            font-family: 'Quicksand', sans-serif; 
            overflow: hidden; 
            position: relative;
            -webkit-user-select: none;
            user-select: none;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(214, 48, 49, 0.15);
            max-width: 80%;
            z-index: 2;
        }

        h1 {
            color: #d63031;
            font-size: 2.5rem;
            font-family: 'Mochi Iyagi', sans-serif;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 150px; 
        }

        button {
            padding: 14px 38px;
            font-size: 1.25rem;
            font-weight: 900;
            border: none;
            border-radius: 50px; 
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            font-family: 'Quicksand', sans-serif; 
            touch-action: manipulation; 
        }

        #btnYes {
            background-color: #2ecc71;
            color: white;
            will-change: transform; 
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            z-index: 999; 
        }

        #btnNo {
            background-color: #e74c3c;
            color: white;
            transition: all 0.2s ease;
            z-index: 1000;
        }

        .flooded-yes {
            position: absolute;
            color: #2ecc71;
            font-family: 'Mochi Iyagi', sans-serif;
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
            animation: popIn 0.3s ease forwards;
            z-index: 1;
            touch-action: manipulation;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1) rotate(var(--rot)); opacity: 0.9; }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h1 id="question">Cậu có thích tớ không? 👉👈❤️</h1>
        <div class="btn-group">
            <button id="btnYes" onclick="sayYes()">CÓ Chứ❤️</button>
            <button id="btnNo" onclick="growYes()">KHÔNG!💔</button>
        </div>
    </div>

    <script>
        let currentScale = 1; 
        let clickCount = 0; 

        const trollTexts = [
            "Ơ kìa, bấm nhầm nút à?",
            "Suy nghĩ lại đi nha...",
            "Không cho bấm nút này đâu!😝",
            "Nút Có bên cạnh kìa cậu ơi",
            "Đừng từ chối màaaaa🥺",
            "Hết lối thoát rồi nhé!😝",
            "Năn nỉ đóooo 😭",
            "Chấp nhận số phận đi hihi"
        ];
        let textIndex = 0;

        function growYes() {
            clickCount++; 

            if (clickCount >= 8) {
                floodScreenWithYes();
                return; 
            }

            const btnYes = document.getElementById('btnYes');
            const btnNo = document.getElementById('btnNo');

            currentScale += 0.4; 
            btnYes.style.transform = `scale(${currentScale})`;

            if (currentScale > 4.5) {
                btnYes.style.transition = 'all 0.3s ease'; 
                btnYes.style.position = 'fixed';
                btnYes.style.top = '0';
                btnYes.style.left = '0';
                btnYes.style.width = '100vw';
                btnYes.style.height = '100vh';
                btnYes.style.borderRadius = '0';
                btnYes.style.transform = 'scale(1)'; 
                btnYes.style.display = 'flex';
                btnYes.style.justifyContent = 'center';
                btnYes.style.alignItems = 'center';
                btnYes.style.fontSize = '4.5rem';
                btnYes.style.fontFamily = "'Mochi Iyagi', sans-serif";
            }

            btnNo.innerText = trollTexts[textIndex];
            textIndex = (textIndex + 1) % trollTexts.length;
        }

        function floodScreenWithYes() {
            document.getElementById('question').innerText = "PHẢI THÍCH TỚ THÔI😤❤️";
            document.getElementById('btnNo').style.display = 'none';

            const btnYes = document.getElementById('btnYes');
            btnYes.style.transform = `scale(2.3)`;

            for (let i = 0; i < 120; i++) {
                setTimeout(() => {
                    const yesText = document.createElement('div');
                    yesText.classList.add('flooded-yes');
                    yesText.innerText = "Có chứ! ❤️";

                    const randomX = Math.random() * 100;
                    const randomY = Math.random() * 100;
                    const randomSize = Math.random() * 2.5 + 1.5;
                    const randomRotate = Math.random() * 70 - 35;

                    yesText.style.left = `${randomX}%`;
                    yesText.style.top = `${randomY}%`;
                    yesText.style.fontSize = `${randomSize}rem`;
                    yesText.style.setProperty('--rot', `${randomRotate}deg`);

                    yesText.style.pointerEvents = 'auto';
                    yesText.style.cursor = 'pointer';
                    yesText.onclick = sayYes;

                    document.body.appendChild(yesText);
                }, i * 15);
            }
        }

        function sayYes() {
            document.body.innerHTML = `
                <div class="container" style="animation: pop 0.5s ease; font-family: 'Quicksand', sans-serif; z-index: 9999; position: relative; border-radius: 30px;">
                    <h1 style="font-size: 3rem; font-family: 'Mochi Iyagi', sans-serif; line-height: 1.4;">Hí hí biết ngay mà🥰❤️</h1>
                    <p style="font-size: 1.5rem; color: #555; font-weight: 700;">Chốt rồi nha, ko đc giả vờ đâu nhé😘</p>
                </div>
            `;
            document.body.style.background = "linear-gradient(135deg, #ff9a9e, #fecfef)";
        }
    </script>

</body>
</html>
